name: Deploy to Railway

# Auto-deploy the tradetally-app service to Railway on every push to main.
# Native Railway GitHub auto-deploy is disconnected, so this workflow replaces it
# by replicating the manual `railway up` deploy from a CI runner.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Never run two deploys at once; let the newest push win.
concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: railway up (tradetally-app)
    runs-on: ubuntu-latest
    env:
      # Railway project token (scoped to the tradetally project + production env).
      # Stored as a repo Actions secret; see remaining-setup notes in the PR/commit.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fail early if RAILWAY_TOKEN is missing
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. Create a Railway project token"
            echo "::error::(Project → Settings → Tokens, environment=production) and add it with:"
            echo "::error::  gh secret set RAILWAY_TOKEN --repo Immutable-Studios/tradetally"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy tradetally-app
        # --service pins the deploy to ONLY the app service (never Postgres).
        # A Railway project token already scopes project + environment, so we
        # don't pass --environment (avoids a token/flag mismatch error).
        # --ci streams build logs and exits when the build finishes.
        run: railway up --ci --service tradetally-app
